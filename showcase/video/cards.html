<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghost-Prime video cards</title>
<!--
  Cards and overlays for the demo video (16:9 only), rendered to PNG by edit.mjs with Playwright:
    cards.html?view=title            1920x1080 title card
    cards.html?view=closing          1920x1080 closing card
    cards.html?view=badge            the small "Demo walkthrough · offline replay" chip (transparent)
    cards.html?view=caption&text=…   one lower-third caption (transparent)
    cards.html?view=thumb&img=…      1920x1080 thumbnail with an app frame
  Name, class and school come in as ?name=&class=&school= (edit.mjs passes storyboard.json → presenter).
  Look: a RED variant of showcase/DESIGN.md, as the presenter asked ("the theme red like the slides").
  Same system (dark ground, Archivo display, Inter body, JetBrains Mono labels, HUD brackets, one accent,
  the gradient only on the wordmark), with red as the accent in place of cyan. Fonts are the kit's bundled
  ones (../slides/assets/fonts), so this works offline. Wordmark outlines and gem shape: ../slides/slides.html.
-->
<style>
@font-face { font-family: 'Archivo Kit'; src: url('../slides/assets/fonts/archivo-latin-var.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; font-display: block; }
@font-face { font-family: 'Inter Kit'; src: url('../slides/assets/fonts/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
@font-face { font-family: 'JetBrains Kit'; src: url('../slides/assets/fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 800; font-display: block; }
:root {
  color-scheme: dark;
  /* red variant of DESIGN.md: Ground/Deck/Ink/Mist/Line warmed toward red, Red is the one accent */
  --ground: #0A0507;
  --deck: #160A0D;
  --ink: #FFF1F1;
  --mist: #C9A7AD;
  --line: #3A1A21;
  --red: #FF3B47;
  --red-soft: #FF6B73;
  --crimson: #C8102E;
  --bracket: rgba(255, 59, 71, 0.45);
  --display: 'Archivo Kit', 'Inter Kit', 'Liberation Sans', Arial, sans-serif;
  --sans: 'Inter Kit', 'Liberation Sans', Arial, sans-serif;
  --mono: 'JetBrains Kit', 'Liberation Mono', 'DejaVu Sans Mono', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
body.card { background: var(--ground); }
.eyebrow { margin: 0; font: 500 24px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--mist); font-variant-numeric: tabular-nums; }
.statement { margin: 0; font-family: var(--display); font-stretch: 125%; font-weight: 820; letter-spacing: -0.02em; line-height: 1.02; text-wrap: balance; }
.display2 { margin: 0; font-family: var(--display); font-stretch: 112%; font-weight: 760; letter-spacing: -0.02em; line-height: 1.08; text-wrap: balance; }
.wordmark { margin: 0; display: block; line-height: 0; }
.wordmark svg { display: block; width: 827px; height: 76px; overflow: visible; }
.presenter { margin: 0; font-size: 36px; font-weight: 600; line-height: 1; padding-top: 30px; border-top: 2px solid var(--line); }
.presenter i { font-style: normal; color: var(--red); font-weight: 400; margin: 0 0.45em; }
.gem { width: 420px; height: 630px; }
/* HUD corner brackets, as on the slides, in red */
.slide { position: relative; overflow: hidden; width: 1920px; height: 1080px; padding: 96px 120px;
  background: radial-gradient(1200px 700px at 82% 50%, rgba(255, 59, 71, 0.07), transparent 70%), var(--ground); }
.slide::before, .slide::after { content: ''; position: absolute; width: 48px; height: 48px; border: 2px solid var(--bracket); }
.slide::before { left: 40px; top: 40px; border-right: 0; border-bottom: 0; }
.slide::after { right: 40px; bottom: 40px; border-left: 0; border-top: 0; }

.s-title .frame { display: grid; grid-template-columns: minmax(0, 1fr) 420px; column-gap: 40px; height: 100%; }
.s-title .main { display: flex; flex-direction: column; justify-content: space-between; }
.s-title .tag { margin-top: 48px; font-size: 124px; }
.s-title .one { margin: 40px 0 0; font-size: 38px; line-height: 1.35; color: var(--mist); max-width: 900px; }
.s-title .gem { align-self: center; }
.s-closing .frame { display: grid; grid-template-columns: minmax(0, 1fr) 360px; column-gap: 40px; height: 100%; }
.s-closing .main { display: flex; flex-direction: column; justify-content: space-between; }
.s-closing .replay { margin-top: 56px; font-size: 56px; color: var(--red-soft); max-width: 1180px; }
.s-closing .come { margin-top: 40px; font-size: 112px; max-width: 1240px; }
.s-closing .gem { width: 360px; height: 540px; align-self: start; margin-top: 10px; }
.chip { display: inline-block; font: 500 24px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--red-soft); border: 1.5px solid rgba(255, 59, 71, 0.5); border-radius: 999px; padding: 12px 22px; background: rgba(10, 5, 7, 0.82); white-space: nowrap; }

/* badge: the small persistent chip, rendered alone on a transparent background */
.badge-wrap { display: inline-block; padding: 4px; }
.badge { display: inline-flex; align-items: center; gap: 12px; font: 500 19px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); border: 1.5px solid rgba(255, 59, 71, 0.6); border-radius: 999px; padding: 12px 20px 12px 16px; background: rgba(22, 10, 13, 0.92); white-space: nowrap; }
.badge::before { content: ''; width: 11px; height: 11px; border-radius: 50%; background: var(--red); box-shadow: 0 0 12px rgba(255, 59, 71, 0.9); }

/* caption: one lower third, in the band under the footage, transparent */
.cap { width: 1100px; height: 96px; display: flex; align-items: center; gap: 22px; padding: 0 4px; }
.cap .bar { width: 6px; height: 48px; border-radius: 3px; background: var(--red); box-shadow: 0 0 14px rgba(255, 59, 71, 0.5); flex: none; }
.cap .text { font: 600 40px/1.1 var(--sans); letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; }

/* thumbnail: wordmark and tagline left, an app frame right */
.s-thumb .frame { display: grid; grid-template-columns: 780px minmax(0, 1fr); column-gap: 56px; align-items: center; height: 100%; }
.s-thumb .wordmark { margin-top: 36px; }
.s-thumb .wordmark svg { width: 700px; height: 64px; }
.s-thumb .statement { margin-top: 36px; font-size: 96px; }
.s-thumb .one { margin: 36px 0 0; font-size: 34px; line-height: 1.35; color: var(--mist); }
.s-thumb .chip { margin-top: 44px; }
.s-thumb .shot { margin: 0; border: 2px solid rgba(255, 59, 71, 0.35); border-radius: 18px; overflow: hidden; background: var(--deck); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(255, 59, 71, 0.12); }
.s-thumb .shot img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
