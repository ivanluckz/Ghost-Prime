<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ghost-Prime</title>
    <style>
      :root {
        --bg: #06080f;
        --panel: #0c1120;
        --line: #1b2438;
        --text: #dfe7f5;
        --dim: #8a97b2;
        --accent: #00d4ff;
        --user: #14223a;
        --assistant: #0e1526;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13.5px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #0a0f1d, #070a13);
      }
      .mark {
        width: 16px; height: 16px; border-radius: 5px;
        background: radial-gradient(circle at 30% 30%, #5ff0ff, #0088aa);
        box-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
      }
      .brand { font-weight: 700; letter-spacing: 0.06em; font-size: 12.5px; }
      .brand b { color: var(--accent); font-weight: 700; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #44506a; margin-left: auto; }
      .dot.live { background: #25d07a; box-shadow: 0 0 8px #25d07a; }
      #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
      .msg { padding: 9px 11px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; border: 1px solid var(--line); }
      .msg .who { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); margin-bottom: 3px; }
      .msg.user { background: var(--user); align-self: flex-end; max-width: 88%; border-color: #1d345a; }
      .msg.assistant { background: var(--assistant); align-self: flex-start; max-width: 92%; }
      .msg.system { background: transparent; border: none; color: var(--dim); font-size: 12px; align-self: center; padding: 2px; }
      .empty { margin: auto; text-align: center; color: var(--dim); padding: 24px; }
      .empty .big { font-size: 26px; margin-bottom: 8px; }
      footer { border-top: 1px solid var(--line); padding: 8px; display: flex; gap: 6px; background: #080b14; }
      textarea {
        flex: 1; resize: none; background: #0a0f1d; color: var(--text);
        border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; max-height: 120px;
      }
      textarea:focus { outline: none; border-color: var(--accent); }
      button {
        background: var(--accent); color: #04121a; border: none; border-radius: 10px;
        padding: 0 14px; font-weight: 700; cursor: pointer;
      }
      button:disabled { opacity: 0.45; cursor: default; }
      .hint { font-size: 11px; color: var(--dim); padding: 0 12px 8px; }
    </style>
  </head>
  <body>
    <header>
      <span class="mark"></span>
      <span class="brand">GHOST<b>-PRIME</b></span>
      <span id="dot" class="dot" title="connection"></span>
    </header>
    <div id="log">
      <div class="empty" id="empty">
        <div class="big">◇</div>
        <div id="emptyMsg">Connecting to Ghost-Prime…</div>
      </div>
    </div>
    <div class="hint" id="hint"></div>
    <footer>
      <textarea id="box" rows="1" placeholder="Message Ghost-Prime…"></textarea>
      <button id="send">Send</button>
    </footer>
    <script src="sidepanel.js"></script>
  </body>
</html>
