<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ghost-Prime</title>
    <style>
      :root {
        --bg: #06080f;
        --cyan: #00e6ff;
        --violet: #7c5cff;
        --magenta: #ff45c0;
        --mint: #2ee6a6;
        --ink: #eef2ff;
        --dim: #9fb0d6;
        --faint: #61719a;
        --line: rgba(255, 255, 255, 0.1);
        --glass: rgba(255, 255, 255, 0.045);
        --glass-soft: rgba(255, 255, 255, 0.03);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        color: var(--ink);
        font: 13.5px/1.55 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(820px 380px at 16% -8%, rgba(0, 230, 255, 0.1), transparent 60%),
          radial-gradient(720px 420px at 110% 4%, rgba(124, 92, 255, 0.12), transparent 55%),
          var(--bg);
      }
      /* Faint HUD grid + cyan scanlines, masked so it fades toward the edges. */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image:
          repeating-linear-gradient(0deg, rgba(0, 230, 255, 0.025) 0 1px, transparent 1px 4px),
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 100% 4px, 42px 42px, 42px 42px;
        -webkit-mask-image: radial-gradient(circle at 50% 30%, #000, transparent 92%);
        mask-image: radial-gradient(circle at 50% 30%, #000, transparent 92%);
      }
      header, #log, footer, .hint { position: relative; z-index: 1; }
      header {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 11px 13px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(12, 17, 32, 0.72), rgba(7, 10, 19, 0.55));
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
      }
      /* Animated holographic rail under the header (matches the app's command bar). */
      header::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 1.5px;
        background: linear-gradient(90deg, transparent, var(--cyan), var(--violet), var(--magenta), var(--cyan), transparent);
        background-size: 240% 100%;
        opacity: 0.75;
        filter: drop-shadow(0 0 5px rgba(0, 230, 255, 0.5));
        animation: rail 11s linear infinite;
      }
      @keyframes rail { to { background-position: 240% 0; } }
      .mark {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        background: conic-gradient(from 0deg, var(--cyan), var(--violet), var(--magenta), var(--cyan));
        box-shadow: 0 0 12px rgba(0, 230, 255, 0.6), inset 0 0 6px rgba(255, 255, 255, 0.5);
        animation: spin 9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .brand {
        font-weight: 800;
        letter-spacing: 0.14em;
        font-size: 13px;
        background: linear-gradient(90deg, var(--cyan), var(--violet), var(--magenta));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--faint);
        margin-left: auto;
        transition: all 0.2s ease;
      }
      .dot.live {
        background: var(--mint);
        animation: pulse 1.7s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(46, 230, 166, 0.5); }
        50% { box-shadow: 0 0 0 5px rgba(46, 230, 166, 0); }
      }

      #log { flex: 1; overflow-y: auto; padding: 13px; display: flex; flex-direction: column; gap: 10px; }
      .msg {
        padding: 9px 12px;
        border-radius: 13px;
        white-space: pre-wrap;
        word-wrap: break-word;
        border: 1px solid var(--line);
        position: relative;
        box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
        animation: msgin 0.32s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      @keyframes msgin {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      .msg .who { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--faint); margin-bottom: 4px; }
      .msg.user {
        align-self: flex-end;
        max-width: 88%;
        background: linear-gradient(135deg, rgba(0, 230, 255, 0.16), rgba(124, 92, 255, 0.16));
        border-color: rgba(0, 230, 255, 0.32);
      }
      .msg.assistant {
        align-self: flex-start;
        max-width: 93%;
        background: var(--glass);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
      }
      /* Holographic left rail on Ghost's replies. */
      .msg.assistant::before {
        content: '';
        position: absolute;
        left: 0;
        top: 9px;
        bottom: 9px;
        width: 2px;
        border-radius: 2px;
        background: linear-gradient(180deg, var(--cyan), var(--violet), var(--magenta));
        box-shadow: 0 0 8px rgba(0, 230, 255, 0.5);
      }
      .msg.system {
        background: transparent;
        border: none;
        color: var(--faint);
        font-size: 12px;
        align-self: center;
        padding: 2px;
        box-shadow: none;
      }

      .empty { margin: auto; text-align: center; color: var(--dim); padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 11px; }
      .empty .big {
        font-size: 30px;
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: var(--cyan);
        background: radial-gradient(circle at 50% 38%, rgba(0, 230, 255, 0.22), transparent 70%);
        box-shadow: inset 0 0 0 1px rgba(0, 230, 255, 0.3), 0 0 26px rgba(0, 230, 255, 0.25);
        animation: float 3.6s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }

      .hint { font-size: 11px; color: var(--faint); padding: 0 13px 8px; }
      footer {
        border-top: 1px solid var(--line);
        padding: 9px;
        display: flex;
        gap: 7px;
        background: linear-gradient(180deg, rgba(8, 11, 20, 0.4), rgba(8, 11, 20, 0.75));
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
      }
      textarea {
        flex: 1;
        resize: none;
        color: var(--ink);
        font: inherit;
        max-height: 120px;
        background: var(--glass-soft);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 9px 11px;
        transition: border-color 0.16s ease, box-shadow 0.16s ease;
      }
      textarea::placeholder { color: var(--faint); }
      textarea:focus {
        outline: none;
        border-color: rgba(0, 230, 255, 0.6);
        box-shadow: 0 0 0 3px rgba(0, 230, 255, 0.14), 0 0 18px rgba(0, 230, 255, 0.16), inset 0 0 14px rgba(0, 230, 255, 0.05);
      }
      button {
        background: linear-gradient(135deg, var(--cyan), var(--violet) 92%);
        color: #04121a;
        border: none;
        border-radius: 11px;
        padding: 0 15px;
        font: inherit;
        font-weight: 800;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.2s ease;
      }
      button:hover { box-shadow: 0 0 18px rgba(0, 230, 255, 0.45); transform: translateY(-1px); }
      button:disabled { opacity: 0.45; cursor: default; box-shadow: none; transform: none; }

      #log::-webkit-scrollbar { width: 9px; }
      #log::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 9px; }
      #log::-webkit-scrollbar-thumb:hover { background: rgba(0, 230, 255, 0.3); }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="mark"></span>
      <span class="brand">GHOST-PRIME</span>
      <span id="dot" class="dot" title="connection"></span>
    </header>
    <div id="log">
      <div class="empty" id="empty">
        <div class="big">◇</div>
        <div id="emptyMsg">Connecting to Ghost-Prime…</div>
      </div>
    </div>
    <div class="hint" id="hint"></div>
    <footer>
      <textarea id="box" rows="1" placeholder="Message Ghost-Prime…"></textarea>
      <button id="send">Send</button>
    </footer>
    <script src="sidepanel.js"></script>
  </body>
</html>
